name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - run: go vet ./...
      - run: go test ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Read the pinned console commit
        id: console
        run: echo "ref=$(tr -d "[:space:]" < test/integration/console-api.ref)" >> "$GITHUB_OUTPUT"
      # engineering-projects DD-0002 owns how CI reads the private console-api.
      - name: Mint a console-api read token
        id: console-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CONSOLE_API_APP_ID }}
          private-key: ${{ secrets.CONSOLE_API_APP_PRIVATE_KEY }}
          owner: mvdatacenter
          repositories: console-api
      # test/integration/run.sh finds the checkout at the pinned commit and builds it as is.
      - uses: actions/checkout@v4
        with:
          repository: mvdatacenter/console-api
          ref: ${{ steps.console.outputs.ref }}
          token: ${{ steps.console-token.outputs.token }}
          path: test/integration/console-api
          persist-credentials: false
      - run: make integration
