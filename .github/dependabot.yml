version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
  - package-ecosystem: "docker-compose"
    directory: "/test/integration"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
    ignore:
      # Moves with console-api.ref: console-api's test/openbao/pin.json fixes the version.
      - dependency-name: "openbao/openbao"
