x-pyx-settings: &pyx-settings
  # The API, the reconciler and the tenant administrator each refuse to start without these four
  # (console-api docs/pyx-secrets.md, "Settings"). They are the bounds a new account gets, so they
  # are the bounds of the account the seed creates.
  PYX_DEFAULT_MAX_SECRETS: "10"
  PYX_DEFAULT_MAX_SECRET_KEYS: "20"
  PYX_DEFAULT_MAX_SECRET_POLICIES: "5"
  # MV Data's own account. The seed creates no such account, so this id names none and every
  # account the tests use is a customer account.
  PYX_ORG_ACCOUNT_ID: 00000000-0000-4000-8000-000000000001
  PG_CONNECTION_STRING: postgres://mvdatacenter:postgres@db:5432/console_api_db

x-audit-bucket: &audit-bucket
  SECRET_AUDIT_BUCKET_ENDPOINT: http://audit_bucket:7070
  SECRET_AUDIT_BUCKET_ACCESS_KEY_ID: acceptance-audit-key
  SECRET_AUDIT_BUCKET_SECRET_ACCESS_KEY: acceptance-audit-secret

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mvdatacenter
      POSTGRES_DB: console_api_db
      POSTGRES_PASSWORD: postgres
    healthcheck:
      # Over TCP: on first start the image runs initdb against a socket-only server and then
      # restarts it, so a socket check can pass while the console's connection is refused.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -d console_api_db -U mvdatacenter"]
      interval: 2s
      timeout: 5s
      retries: 15

  openbao:
    image: quay.io/openbao/openbao:2.4.1
    command: server -dev -dev-root-token-id=test-root-token -dev-listen-address=0.0.0.0:8200
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 2s
      timeout: 5s
      retries: 15

  audit_bucket:
    image: versity/versitygw:v1.9.0
    command: --access acceptance-audit-key --secret acceptance-audit-secret --region auto posix /tmp

  console:
    build: ./console-api
    # NODE_ENV=test keeps the console from reaching Sentry, Turnstile, and the email service, none
    # of which a throwaway console has credentials for.
    environment:
      <<: [*pyx-settings, *audit-bucket]
      NODE_ENV: test
      CONSOLE_DEFAULT_REGION: uae-1
      # The console refuses to start without its public origin. It builds sign-in redirects from
      # it, which no command here follows, so the address it listens on inside the container is
      # enough.
      API_URL: http://localhost:7734
      ACCEPTANCE_API_KEY: ${ACCEPTANCE_API_KEY:?make integration sets ACCEPTANCE_API_KEY}
      PYX_RECONCILER_URL: http://reconciler:7735
      PYX_TENANT_ADMIN_URL: http://tenant_admin:7736
      # Where pyx-setup.js, which run.sh runs in this container, finds OpenBao.
      PYX_TEST_ADDR: http://openbao:8200
    command:
      - sh
      - -c
      - node dist/app/db/migrate.js && node dist/app/db/seedAcceptance.js && exec node dist/app/server.js
    ports:
      # Docker picks the host port, so a run never collides with another console on the daemon.
      - "7734"
    depends_on:
      db:
        condition: service_healthy
      openbao:
        condition: service_healthy
      audit_bucket:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://localhost:7734/regions\").then(r => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 60

  reconciler:
    build: ./console-api
    environment:
      <<: *pyx-settings
      NODE_ENV: test
      PYX_ADDR: http://openbao:8200
      PYX_TOKEN: ${PYX_RECONCILER_TOKEN:?make integration sets PYX_RECONCILER_TOKEN}
    command: ["node", "dist/app/reconciler/server.js"]
    depends_on:
      console:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://localhost:7735/health\").then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

  tenant_admin:
    build: ./console-api
    environment:
      <<: *pyx-settings
      NODE_ENV: test
      PYX_ADDR: http://openbao:8200
      PYX_TOKEN: ${PYX_TENANT_ADMIN_TOKEN:?make integration sets PYX_TENANT_ADMIN_TOKEN}
    command: ["node", "dist/app/reconciler/tenantAdmin.js"]
    depends_on:
      console:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(\"http://localhost:7736/health\").then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
